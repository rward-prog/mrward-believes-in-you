<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Ward Believes in You!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #FFE066 0%, #FF6B9D 50%, #845EC2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka One', cursive;
    overflow: hidden;
    position: relative;
  }
  .deco { position: absolute; font-size: 2rem; animation: float 3s ease-in-out infinite; pointer-events: none; }
  .deco:nth-child(1) { top:5%; left:5%; animation-delay:0s; }
  .deco:nth-child(2) { top:10%; right:8%; animation-delay:0.5s; }
  .deco:nth-child(3) { top:70%; left:3%; animation-delay:1s; }
  .deco:nth-child(4) { top:75%; right:5%; animation-delay:1.5s; }
  .deco:nth-child(5) { top:40%; left:2%; animation-delay:0.8s; }
  .deco:nth-child(6) { top:40%; right:2%; animation-delay:1.2s; }
  .deco:nth-child(7) { top:90%; left:15%; animation-delay:0.3s; }
  .deco:nth-child(8) { top:88%; right:15%; animation-delay:0.7s; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(15deg); }
  }
  .title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: white;
    text-shadow: 4px 4px 0 #845EC2, 6px 6px 0 rgba(0,0,0,.2);
    margin-bottom: 20px;
    text-align: center;
    z-index: 1;
    animation: titleBounce 2s ease-in-out infinite;
  }
  @keyframes titleBounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }

  .face-outer {
    position: relative;
    z-index: 2;
    cursor: pointer;
    user-select: none;
    filter: drop-shadow(0 12px 36px rgba(0,0,0,0.35));
    transition: transform 0.1s;
  }
  .face-outer:hover { transform: scale(1.03); }
  .face-outer:active { transform: scale(0.96); }

  /* Canvas is the whole face — we draw everything on it */
  #faceCanvas {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    display: block;
  }

  .bubble {
    position: absolute;
    bottom: -90px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: white;
    border-radius: 20px;
    padding: 12px 22px;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1rem, 3vw, 1.5rem);
    color: #845EC2;
    box-shadow: 0 4px 20px rgba(0,0,0,.2);
    z-index: 10;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
    max-width: 320px;
    white-space: normal;
    text-align: center;
  }
  .bubble::after {
    content: '';
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-bottom-color: white;
  }
  .bubble.show { transform: translateX(-50%) scale(1); }

  .burst {
    position: fixed;
    pointer-events: none;
    font-size: 1.6rem;
    z-index: 30;
    animation: burstAnim 0.8s ease-out forwards;
  }
  @keyframes burstAnim {
    0%   { opacity:1; transform: translate(0,0) scale(1.2); }
    100% { opacity:0; transform: translate(var(--tx),var(--ty)) scale(0.2); }
  }

  #inputWrap {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    width: min(480px, 90vw);
  }
  #customInput {
    width: 100%;
    padding: 10px 18px;
    border-radius: 30px;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    outline: none;
    backdrop-filter: blur(6px);
    transition: background 0.3s, border 0.3s, color 0.3s;
    text-align: center;
  }
  #customInput::placeholder { color: rgba(255,255,255,0.4); }
  #customInput:focus {
    background: rgba(255,255,255,0.28);
    border-color: rgba(255,255,255,0.6);
    color: white;
  }
</style>
</head>
<body>

<div class="deco">⭐</div>
<div class="deco">🌟</div>
<div class="deco">✨</div>
<div class="deco">💫</div>
<div class="deco">🌈</div>
<div class="deco">⭐</div>
<div class="deco">🌟</div>
<div class="deco">✨</div>

<h1 class="title">🎓 Mr. Ward Believes in You!</h1>

<div class="face-outer" id="faceOuter">

    <div class="bubble" id="bubble">🌟 I believe in you! 🌟</div>
  </div>
</div>

<div id="inputWrap">
  <input id="customInput" type="text" placeholder="" autocomplete="off"/>
</div>

  let jawAmt = 0;   // 0=closed 1=open
  let animating = false;
  let animDir = 1;
  let rafId = null;

  img.onload = function() {
    drawFace(0);
  };

  function drawFace(open) {
    // Draw full circular photo
    ctx.save();
    ctx.beginPath();
    ctx.arc(150, 150, 150, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, 0, 0, 300, 300);
    ctx.restore();

    if (open <= 0.01) return;

    const dropY = Math.round(open * 30); // South Park jaw drop

    ctx.save();
    ctx.beginPath();
    ctx.arc(150, 150, 150, 0, Math.PI * 2);
    ctx.clip();

    // Black mouth interior rectangle
    ctx.fillStyle = '#111111';
    ctx.fillRect(120, 160, 60, dropY + 10);

    // White teeth strip at top of gap
    if (dropY > 3) {
      ctx.fillStyle = '#ede8d8';
      ctx.fillRect(122, 160, 56, Math.min(9, dropY * 0.45));
    }

    // Lower lip: stamp the strip from the photo shifted straight down
    ctx.drawImage(img,
      118, 160, 64, 14,
      118, 160 + dropY, 64, 14
    );

    ctx.restore();
  }

    function startJaw() {
    if (animating) return;
    animating = true;
    animDir = 1;
    function step() {
      if (!animating) return;
      jawAmt += animDir * 0.1;
      if (jawAmt >= 1)  { jawAmt = 1;  animDir = -1; }
      if (jawAmt <= 0)  { jawAmt = 0;  animDir =  1; }
      ctx.clearRect(0, 0, 300, 300);
      drawFace(jawAmt);
      rafId = requestAnimationFrame(step);
    }
    step();
  }

  function stopJaw() {
    animating = false;
    cancelAnimationFrame(rafId);
    function close() {
      jawAmt -= 0.07;
      if (jawAmt <= 0) { jawAmt = 0; ctx.clearRect(0,0,300,300); drawFace(0); return; }
      ctx.clearRect(0, 0, 300, 300);
      drawFace(jawAmt);
      requestAnimationFrame(close);
    }
    close();
  }

  // Speech
  let currentVoice = null;
  let talkTimer = null;
  let speechTimer = null;
  let talking = false;

  function pickVoice() {
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;
    const preferred = ['Google UK English Male','Microsoft David','Daniel','Alex','Fred'];
    for (const name of preferred) {
      const v = voices.find(v => v.name.includes(name));
      if (v) { currentVoice = v; return; }
    }
    currentVoice = voices.find(v => v.lang && v.lang.startsWith('en')) || voices[0] || null;
  }
  window.speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice(); setTimeout(pickVoice, 500);

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(() => {
      pickVoice();
      const utt = new SpeechSynthesisUtterance(text);
      if (currentVoice) utt.voice = currentVoice;
      utt.rate = 0.82; utt.pitch = 0.55; utt.volume = 1;
      utt.onend = endTalking;
      utt.onerror = endTalking;
      clearTimeout(talkTimer);
      talkTimer = setTimeout(endTalking, Math.max(2500, text.length * 85));
      window.speechSynthesis.speak(utt);
    }, 80);
  }

  function spawnBursts() {
    const emojis = ['⭐','🌟','✨','💫','🎉','❤️','🎊','🌈'];
    const rect = faceOuter.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    for (let i = 0; i < 8; i++) {
      const el = document.createElement('div');
      el.className = 'burst';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = (i / 8) * 2 * Math.PI, dist = 80 + Math.random() * 80;
      el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      el.style.left = cx + 'px'; el.style.top = cy + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
  }

  function startTalking(text, burst) {
    if (talking) { window.speechSynthesis.cancel(); endTalking(); }
    talking = true;
    bubble.textContent = text;
    bubble.classList.add('show');
    startJaw();
    speak(text);
    if (burst) spawnBursts();
  }

  function endTalking() {
    stopJaw();
    clearTimeout(talkTimer);
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => {
      bubble.classList.remove('show');
      talking = false;
    }, 500);
  }

  faceOuter.addEventListener('click', () => startTalking('I believe in you!', true));
  // Bad word list
  const badWords = [
    'fuck','shit','ass','asshole','bitch','cunt','dick','cock','pussy','bastard',
    'damn','hell','crap','piss','fag','faggot','nigger','nigga','whore','slut',
    'motherfucker','fucker','bullshit','jackass','dumbass','idiot','retard',
    'wtf','stfu','damn','prick','twat','balls','penis','vagina','boob','tit',
    'porn','sexy','naked','nude','kill','murder','hate','stupid','dumb'
  ];

  function containsBadWord(text) {
    const lower = text.toLowerCase().replace(/[^a-z0-9 ]/g, '');
    const words = lower.split(/\s+/);
    return words.some(w => badWords.includes(w)) || 
           badWords.some(b => lower.includes(b));
  }

  function cameraClick() {
    const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
    // Shutter mechanical click sound
    const buf = ctx2.createBuffer(1, ctx2.sampleRate * 0.3, ctx2.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / ctx2.sampleRate;
      if (t < 0.005) {
        data[i] = (Math.random() * 2 - 1) * (1 - t / 0.005); // click
      } else if (t < 0.02) {
        data[i] = (Math.random() * 2 - 1) * 0.3 * Math.exp(-t * 80); // clack
      } else if (t > 0.08 && t < 0.085) {
        data[i] = (Math.random() * 2 - 1) * 0.8; // second click
      } else {
        data[i] = 0;
      }
    }
    const src = ctx2.createBufferSource();
    src.buffer = buf;
    src.connect(ctx2.destination);
    src.start();

    // Flash white screen
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;opacity:0.9;pointer-events:none;';
    document.body.appendChild(flash);
    setTimeout(() => { flash.style.transition = 'opacity 0.4s'; flash.style.opacity = '0'; }, 80);
    setTimeout(() => flash.remove(), 500);
  }

  customInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const txt = customInput.value.trim();
      if (!txt) return;
      if (containsBadWord(txt)) {
        const warningText = "Mr. Ward would never say such a thing! Your name and picture are being recorded.";
        startTalking(warningText, false);
        const warningMs = Math.max(2500, warningText.length * 85) + 200;
        setTimeout(() => { cameraClick(); }, warningMs);
      } else {
        startTalking(txt, false);
      }
      customInput.value = '';
      customInput.blur();
    }
  });
});
